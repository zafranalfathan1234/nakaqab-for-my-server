<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kalender Nakaqab (1 N)</title>
  <style>
    :root {
      --bg1: #090d16;
      --bg2: #1e1b4b;
      --card: rgba(255, 255, 255, 0.08);
      --card-strong: rgba(255, 255, 255, 0.14);
      --text: #f8fafc;
      --muted: #cbd5e1;
      --accent: #f59e0b;
      --accent-2: #10b981;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, var(--bg1), var(--bg2));
      color: var(--text);
      padding: 24px;
    }

    .container {
      width: min(1000px, 100%);
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(12px);
      overflow: hidden;
    }

    .header {
      padding: 32px 24px 20px;
      text-align: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(0, 0, 0, 0.2);
    }

    .header h1 {
      font-size: clamp(2rem, 4vw, 2.8rem);
      margin-bottom: 8px;
      background: linear-gradient(to right, #f59e0b, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header p {
      color: var(--muted);
      font-size: 1rem;
    }

    .content {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 24px;
      padding: 24px;
    }

    .left-panel {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .date-card, .time-card, .month-card {
      background: var(--card);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 22px;
    }

    .label {
      color: var(--accent);
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-size: 0.8rem;
      margin-bottom: 10px;
    }

    .nakaqab-date {
      font-size: clamp(1.6rem, 3vw, 2.3rem);
      font-weight: bold;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .gregorian-date {
      color: var(--muted);
      font-size: 1rem;
      margin-bottom: 14px;
    }

    .badge {
      display: inline-block;
      background: rgba(16, 185, 129, 0.2);
      color: #6ee7b7;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      border: 1px solid rgba(16, 185, 129, 0.4);
      width: fit-content;
    }

    /* Penunjuk Jam / Waktu */
    .time-card h2 {
      font-size: 1.1rem;
      margin-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 8px;
      color: var(--accent-2);
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.2);
      outline: none;
      font-size: 0.95rem;
    }

    select:focus {
      border-color: var(--accent);
    }

    .time-result {
      margin-top: 15px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      border-left: 4px solid var(--accent);
      font-size: 1.1rem;
      font-weight: bold;
    }

    /* Kartu Bulan */
    .month-card h2 {
      margin-bottom: 16px;
      font-size: 1.2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .month-card h2 span {
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: normal;
    }

    .months {
      display: grid;
      grid-template-columns: repeat(2, minmax(130px, 1fr));
      gap: 10px;
    }

    .month {
      background: var(--card-strong);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 10px 8px;
      text-align: center;
      color: var(--text);
      transition: all 0.3s ease;
      font-size: 0.9rem;
    }

    .month .m-name {
      font-weight: bold;
      display: block;
    }

    .month .m-info {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 4px;
      display: block;
    }

    .month:nth-child(odd) {
      border-left: 3px solid var(--accent);
    }

    .month:nth-child(even) {
      border-left: 3px solid var(--accent-2);
    }

    .month.active {
      background: linear-gradient(135deg, var(--accent), #d97706);
      color: #0f172a;
      font-weight: bold;
      transform: scale(1.02);
      box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
    }

    .month.active .m-info {
      color: #1e293b;
    }

    @media (max-width: 768px) {
      .content {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Kalender Nakaqab (1 N)</h1>
      <p>Sistem Kalender Lunar Revisi • Total 279 Hari / Tahun</p>
    </div>

    <div class="content">
      <div class="left-panel">
        <!-- Kartu Tanggal -->
        <div class="date-card">
          <div class="label">Tanggal Nakaqab Hari Ini</div>
          <div id="nakaqabDate" class="nakaqab-date">Memuat...</div>
          <div id="gregorianDate" class="gregorian-date">Memuat...</div>
          <div class="badge" id="statusBadge">Tahun 1 N (Siklus Lunar)</div>
        </div>

        <!-- Kartu Jam / Waktu -->
        <div class="time-card">
          <h2>Sistem Penunjuk Jam Nakaqab</h2>
          
          <div class="form-group">
            <label for="sunShadow">A. Jam Matahari (Arah Bayangan):</label>
            <select id="sunShadow" onchange="calculateTime()">
              <option value="">-- Pilih Arah Bayangan --</option>
              <option value="1">Bayangan ke Barat Daya (Jam 1)</option>
              <option value="2">Bayangan ke Selatan / Utara (Jam 2)</option>
              <option value="3">Bayangan ke Tenggara (Jam 3)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="skyColor">B. Jam Malam / Sore (Warna Langit):</label>
            <select id="skyColor" onchange="calculateTime()">
              <option value="">-- Pilih Warna Langit --</option>
              <option value="4">Biru Terang (Jam 4)</option>
              <option value="5">Biru Hitam (Jam 5)</option>
              <option value="6">Hitam (Jam 6)</option>
              <option value="7">Biru Hitam (Jam 7)</option>
              <option value="8">Hitam (Jam 8)</option>
              <option value="9">Biru Terang (Jam 9)</option>
              <option value="1">Langit Putih (Gunakan Matahari +1 Jam, Jam 1)</option>
            </select>
          </div>

          <div id="timeResult" class="time-result">
            Pilih kondisi bayangan atau langit di atas
          </div>
        </div>
      </div>

      <!-- Kartu Daftar Bulan -->
      <div class="month-card">
        <h2>Daftar Bulan Nakaqab <span>12 Bulan / 279 Hari</span></h2>
        <div class="months" id="monthsContainer">
          <!-- Rendered via JavaScript -->
        </div>
      </div>
    </div>
  </div>

  <script>
    // System Data Bulan Nakaqab (Total 279 Hari)
    const bulanNakaqab = [
      { nama: "Jabar", siklus: "Mati → Purnama", hari: 15 },
      { nama: "Fabar", siklus: "Mati → Mati berikutnya", hari: 30 },
      { nama: "Safar", siklus: "Mati → Purnama", hari: 15 },
      { nama: "Rajaq", siklus: "Mati → Mati berikutnya", hari: 30 },
      { nama: "Rajab", siklus: "Mati → Purnama", hari: 15 },
      { nama: "Ali", siklus: "Mati → Mati berikutnya", hari: 30 },
      { nama: "Fajar", siklus: "Mati → Purnama", hari: 15 },
      { nama: "Rajaf", siklus: "Mati → Mati berikutnya", hari: 30 },
      { nama: "Raja", siklus: "Mati → Purnama", hari: 15 },
      { nama: "Talaq", siklus: "Mati → Mati berikutnya", hari: 30 },
      { nama: "Lasaq", siklus: "Mati → Purnama", hari: 15 },
      { nama: "Ganiz / Zabar", siklus: "Mati → Mati berikutnya", hari: 29 }
    ];

    const TOTAL_HARI_TAHUN = 279;
    const EPOCH_GREGORIAN = new Date(2024, 0, 1); // Epoch Tahun 1 Nakaqab

    function renderMonthList() {
      const container = document.getElementById("monthsContainer");
      container.innerHTML = "";
      
      bulanNakaqab.forEach((b, index) => {
        const div = document.createElement("div");
        div.className = "month";
        div.id = `month-${index}`;
        div.innerHTML = `
          <span class="m-name">${index + 1}. ${b.nama}</span>
          <span class="m-info">${b.siklus} (${b.hari} hr)</span>
        `;
        container.appendChild(div);
      });
    }

    function calculateNakaqabDate() {
      const today = new Date();
      
      const diffTime = today - EPOCH_GREGORIAN;
      const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
      
      let nakaqabYear = 1;
      let dayOfYear = diffDays % TOTAL_HARI_TAHUN;
      
      if (diffDays >= 0) {
        nakaqabYear += Math.floor(diffDays / TOTAL_HARI_TAHUN);
      } else {
        const absDays = Math.abs(diffDays);
        nakaqabYear = 1 - Math.ceil(absDays / TOTAL_HARI_TAHUN);
        dayOfYear = (TOTAL_HARI_TAHUN - (absDays % TOTAL_HARI_TAHUN)) % TOTAL_HARI_TAHUN;
      }

      let currentMonthIndex = 0;
      let dayOfMonth = dayOfYear + 1;

      for (let i = 0; i < bulanNakaqab.length; i++) {
        if (dayOfMonth <= bulanNakaqab[i].hari) {
          currentMonthIndex = i;
          break;
        }
        dayOfMonth -= bulanNakaqab[i].hari;
      }

      const bulanAktif = bulanNakaqab[currentMonthIndex];

      document.getElementById("nakaqabDate").textContent = 
        `${dayOfMonth} ${bulanAktif.nama} ${nakaqabYear} N`;

      const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
      document.getElementById("gregorianDate").textContent = 
        `Masehi: ${today.toLocaleDateString('id-ID', options)}`;

      const monthElements = document.querySelectorAll('.month');
      monthElements.forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`month-${currentMonthIndex}`);
      if (activeEl) {
        activeEl.classList.add('active');
      }
    }

    function calculateTime() {
      const sunVal = document.getElementById("sunShadow").value;
      const skyVal = document.getElementById("skyColor").value;
      const resDiv = document.getElementById("timeResult");

      if (sunVal) {
        resDiv.textContent = `Jam Nakaqab (Matahari): Jam ${sunVal}`;
        document.getElementById("skyColor").value = "";
      } else if (skyVal) {
        if (skyVal === "1") {
          resDiv.textContent = `Jam Nakaqab: Langit Putih → Gunakan Jam 1 (Matahari +1 jam)`;
        } else {
          resDiv.textContent = `Jam Nakaqab (Sore/Malam): Jam ${skyVal}`;
        }
        document.getElementById("sunShadow").value = "";
      } else {
        resDiv.textContent = "Pilih kondisi bayangan atau langit di atas";
      }
    }

    renderMonthList();
    calculateNakaqabDate();
  </script>
</body>
</html>

init();
</script>
</body>
</html>
